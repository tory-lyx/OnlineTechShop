<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnlineTechShop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header id="main-header">
        <h1>Вітаємо у таємному магазині техніки</h1>
        <div id="header-buttons">
            <button id="btn-login-show">Увійти</button>
            <button id="btn-register-show">Реєстрація</button>
            <button id="btn-logout" class="hidden">Вийти</button>

            <button id="btn-admin-catalog" class="hidden">Каталог</button>
            <button id="btn-admin-panel" class="hidden">Адмін панель</button>
            <!-- Кнопки користувача (Корзина + Історія) додаються JS через createUserHeaderButtons() -->
        </div>
    </header>

    <div id="login-container" class="centered">
        <h2>Вхід</h2>
        <input type="text" id="login" placeholder="Логін">
        <input type="password" id="password" placeholder="Пароль">
        <button id="btn-login">Увійти</button>
        <p id="login-error" class="error"></p>
    </div>

    <div id="register-container" class="centered hidden">
        <h2>Реєстрація</h2>
        <input type="text" id="reg-login" placeholder="Логін">
        <input type="password" id="reg-password" placeholder="Пароль">
        <button id="btn-register">Зареєструватися</button>
        <p id="register-error" class="error"></p>
    </div>

    <div id="user-container" class="hidden">
        <h2>Каталог товарів</h2>
        <div id="filters">
            <input type="text" id="filter-name" placeholder="Пошук за назвою">
            <input type="number" id="filter-min-price" placeholder="Мін. ціна">
            <input type="number" id="filter-max-price" placeholder="Макс. ціна">
            <button id="btn-filter">Фільтрувати</button>
        </div>
        <div id="products"></div>

        <div id="cart" class="hidden"></div>
        <button id="btn-checkout" class="hidden">Оформити замовлення</button>
    </div>

    <div id="admin-container" class="hidden">
        <h2>Адмін панель</h2>

        <h3>Користувачі</h3>
        <table id="users-table">
            <thead>
                <tr><th>Id</th><th>Login</th><th>Role</th><th>CreatedAt</th></tr>
            </thead>
            <tbody></tbody>
        </table>

        <h3>Товари</h3>
        <table id="products-table">
            <thead>
                <tr><th>Id</th><th>Name</th><th>Price</th><th>Stock</th><th>Active</th><th>Дії</th></tr>
            </thead>
            <tbody></tbody>
        </table>

        <h3>Додати новий товар</h3>
        <form id="add-product-form">
            <input type="text" id="new-product-name" placeholder="Назва товару" required>
            <input type="number" step="0.01" id="new-product-price" placeholder="Ціна" required>
            <input type="number" id="new-product-stock" placeholder="Кількість на складі" required>
            <input type="file" id="new-product-image" accept="image/*" required>
            <button type="submit">Додати товар</button>
            <p id="add-product-error" class="error"></p>
        </form>

        <h3>Замовлення</h3>
        <table id="orders-table">
            <thead>
                <tr><th>Id</th><th>User</th><th>Total</th><th>Status</th><th>Дії</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div id="order-history-modal" class="hidden">
        <div id="order-history-content">
            <h3>Історія ваших замовлень</h3>
            <table id="order-history-table">
                <thead>
                    <tr><th>Id</th><th>Товари</th><th>Кількість</th><th>Сума</th><th>Статус</th></tr>
                </thead>
                <tbody></tbody>
            </table>
            <button id="close-order-history">Закрити</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
